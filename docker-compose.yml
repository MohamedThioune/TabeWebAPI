services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: app_tabe
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  nginx:
    image: nginx:latest
    container_name: nginx_tabe
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  redis:
    image: redis:latest
    container_name: redis_tabe